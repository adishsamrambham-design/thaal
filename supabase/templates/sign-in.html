<h2>Your sign-in code</h2>
<p>Enter this code on the sign-in page:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 4px">{{ .Token }}</p>
<p>Or <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email">sign in with this link</a>.</p>
<p>The code expires in one hour. If you didn't ask to sign in to Thaal, ignore this email.</p>
